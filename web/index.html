<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071412">
    <meta name="description" content="Ride Zebra through the Continuum in a playable cinematic chase.">
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png">
    <title>ZEBRA!! · Continuum Chase</title>
  </head>
  <body>
    <main id="game">
      <canvas id="viewport" aria-label="Continuum Chase 3D scene"></canvas>
      <div class="screen-grade" aria-hidden="true"></div>

      <header class="topbar">
        <span class="wordmark"><span class="stripes" aria-hidden="true"></span> ZEBRA!!</span>
        <div class="utility">
          <button id="mute" type="button" aria-pressed="false">Sound on</button>
          <button id="pause" type="button" hidden>Pause</button>
        </div>
      </header>

      <section id="intro" class="intro" aria-labelledby="title">
        <div class="intro-copy">
          <p class="scene-label"><span></span> THE LAST ORIGINAL THOUGHT</p>
          <h1 id="title">CONTINUUM<br><em>CHASE</em></h1>
          <p class="brief">The city’s AI wants Stan off-script. Zebra is his ride out.</p>
          <button id="start" class="action" type="button" disabled>Loading the chase…</button>
          <p id="load-error" class="load-error" role="status" hidden></p>
        </div>
        <div class="control-guide" aria-label="Controls">
          <span><kbd>A</kbd> <kbd>D</kbd> Steer</span>
          <span><kbd>Space</kbd> Jump</span>
          <span><kbd>W</kbd> Gallop</span>
          <span><kbd>S</kbd> Brake</span>
        </div>
      </section>

      <section id="hud" class="hud" aria-label="Chase status" hidden>
        <div class="route">
          <div class="route-label"><span id="sector">Cinema Row</span><span id="distance">730 m</span></div>
          <div class="route-track" aria-hidden="true"><div id="progress"></div><span></span><span></span></div>
        </div>
        <div class="speedometer"><strong id="speed">00</strong><span>KM/H</span></div>
        <p id="hint" class="hint"></p>
        <div id="touch" class="touch" role="group" aria-label="Touch controls">
          <div class="touch-steering">
            <button type="button" data-control="left" aria-label="Steer left"><span aria-hidden="true">◀</span></button>
            <button type="button" data-control="right" aria-label="Steer right"><span aria-hidden="true">▶</span></button>
          </div>
          <div class="touch-actions">
            <button type="button" data-control="brake">Brake</button>
            <button type="button" data-control="sprint">Gallop</button>
            <button type="button" data-control="jump">Jump</button>
          </div>
        </div>
        <div id="caption" class="caption" role="status" hidden><strong id="speaker"></strong><span id="line"></span></div>
      </section>

      <section id="panel" class="dialog" aria-labelledby="panel-title" hidden>
        <div class="dialog-card">
          <p id="panel-label" class="scene-label"></p>
          <h2 id="panel-title"></h2>
          <p id="panel-detail"></p>
          <button id="panel-action" class="action" type="button"></button>
        </div>
      </section>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
